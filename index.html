<script>
    const callback = (error, data) => {
        if (error) {
            console.log(`calling error :`, error);
        }
        if (data) {
            console.log(`calling success`, data);
        }
    }
    function gettodos(id, callback) {
        return new Promise((resolve, reject) => {
            var request = new XMLHttpRequest();
            request.onreadystatechange = function () {
                if (this.readyState == 4 && request.status === 200) {
                    // Typical action to be performed when the document is ready:
                    const data = JSON.parse(this.responseText);
                    const cvstring = JSON.stringify(data);
                    // callback(undefined, data);
                    resolve(data)
                    // callback(undefined, cvstring);

                } if (this.readyState == 4 && request.status !== 200) {
                    // callback(`something wrong`, undefined);
                    reject(`something wrong`);
                }
            };
            request.open("GET", `https://jsonplaceholder.typicode.com/todos/${id}`, true);
            request.withCredentials = true;
            request.send();
        })
    }
    gettodos(1).
        then(data1 => {
            console.log(`get data 1`, data1)
            return gettodos(2);
        }).then(data2 => {
            console.log(`get data 2`, data2);

        }).then(data3 => {
            console.log(`get data 3`, data3);

        }).catch(err => {
            console.log(`promise error`, err);
        });
</script>
